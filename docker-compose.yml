services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-expense-password}
    volumes:
      - expense-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expenses"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/expenses
      SPRING_DATASOURCE_USERNAME: expense
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-expense-password}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:19006}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  expense-data:
